name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install unzip
      run: sudo apt-get update && sudo apt-get install -y unzip
      
    - name: Unzip Source
      run: unzip WBHub.zip
      
    - uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Find and Build
      run: |
        echo "开始自动寻找 gradlew 文件..."
        GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
        
        if [ -z "$GRADLEW_PATH" ]; then
          echo "❌ 致命错误：在压缩包里根本没找到 gradlew 文件！"
          exit 1
        fi
        
        echo "✅ 找到了 gradlew，路径是: $GRADLEW_PATH"
        PROJECT_DIR=$(dirname "$GRADLEW_PATH")
        echo "✅ 项目根目录是: $PROJECT_DIR"
        
        cd "$PROJECT_DIR"
        chmod +x gradlew
        ./gradlew :app:assembleDebug --stacktrace
        
    - uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/app/build/outputs/apk/debug/app-debug.apk"
