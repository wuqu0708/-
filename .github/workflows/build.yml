name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Unzip Source
      run: unzip WBHub.zip
      
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Build
      run: |
        cd WBHub
        chmod +x gradlew
        ./gradlew :app:assembleDebug
        
    - uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: WBHub/app/build/outputs/apk/debug/app-debug.apk
